<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FileLynx Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
</head>
<body>
  <aside id="sidebar">
    <div class="brand">FILELYNX ✰</div>
    <nav>
      <ul>
        <li><button class="nav-btn active" data-view="files">Archivos</button></li>
        <li><button class="nav-btn" data-view="terminal">Terminal</button></li>
        <li><button class="nav-btn" data-view="notebooks">Notebooks</button></li>
        <li><button class="nav-btn" data-view="ftp">Cliente FTP</button></li>
        <li><button class="nav-btn" data-view="s3">S3 Cloud</button></li>
      </ul>
    </nav>
  </aside>

  <section id="main-content">
    <header>
      <div id="status-bar">Conectado</div>
      <div id="user-info">admin</div>
    </header>
    <main id="view-container"></main>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
